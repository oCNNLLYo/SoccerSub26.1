<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>Youth Soccer Substitution Planner</title>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #121c2d;
      --panel-2: #18253a;
      --border: #2d405e;
      --text: #f4f8ff;
      --muted: #aebcd1;
      --blue: #4ba3ff;
      --green: #55d990;
      --purple: #bd96ff;
      --gold: #ffd06a;
      --red: #ff7f7f;
      --good-bg: #123b24;
      --warn-bg: #3d2d10;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding-bottom: 110px;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.35;
    }

    header {
      padding: 22px 18px;
      background: linear-gradient(135deg, #152b4b, #194475);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 1.45rem;
    }

    header p {
      margin: 0;
      color: #d6e5fc;
      font-size: 0.9rem;
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      margin-bottom: 16px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    h2, h3 {
      margin: 0 0 12px;
    }

    h2 { font-size: 1.2rem; }
    h3 { font-size: 1rem; color: #dce9ff; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: bold;
    }

    select, input[type="number"] {
      width: 100%;
      min-height: 46px;
      padding: 10px;
      color: var(--text);
      background: #0c1525;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 1rem;
    }

    .hint {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .roster-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .player-card {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 12px;
      min-height: 68px;
      padding: 11px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .player-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .player-number {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: normal;
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin: 0;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: bold;
    }

    input[type="checkbox"] {
      width: 25px;
      height: 25px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    .status.good {
      display: block;
      color: #cdf8db;
      background: var(--good-bg);
      border: 1px solid #338658;
    }

    .status.warning {
      display: block;
      color: #ffe4a8;
      background: var(--warn-bg);
      border: 1px solid #98772b;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      padding: 11px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 4px;
      color: white;
      font-size: 1.18rem;
      font-weight: bold;
    }

    .segment-card {
      margin: 10px 0;
      padding: 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .segment-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
      color: white;
      font-weight: bold;
    }

    .checkpoint {
      color: var(--muted);
      font-size: 0.77rem;
      text-align: right;
    }

    .role-row {
      margin: 8px 0;
      font-size: 0.9rem;
    }

    .role-label {
      display: inline-block;
      min-width: 88px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .goalie { color: var(--gold); font-weight: bold; }
    .offense { color: var(--green); font-weight: bold; }
    .defense { color: var(--purple); font-weight: bold; }
    .bench { color: var(--red); font-weight: bold; }

    .player-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      margin: 9px 0;
      padding: 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .player-summary strong {
      font-size: 1rem;
    }

    .detail {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .minutes {
      color: white;
      text-align: right;
      font-weight: bold;
    }

    .minimum-yes { color: var(--green); }
    .minimum-no { color: var(--red); }

    .empty {
      padding: 25px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 11px;
    }

    .sticky-actions {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(11, 18, 32, 0.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    button {
      min-height: 52px;
      padding: 11px;
      color: white;
      background: #2b6eb8;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.94rem;
      font-weight: bold;
    }

    button.success { background: #25854e; }
    button.secondary { background: #35445b; }
    button.wide { grid-column: 1 / -1; }

    @media (min-width: 720px) {
      body { padding-bottom: 30px; }

      main {
        display: grid;
        grid-template-columns: minmax(370px, 0.85fr) minmax(520px, 1.3fr);
        gap: 18px;
        align-items: start;
      }

      .settings-card { grid-column: 1; }
      .results-card { grid-column: 2; }

      .roster-grid { grid-template-columns: 1fr 1fr; }
      .summary-grid { grid-template-columns: repeat(4, 1fr); }

      .sticky-actions {
        position: static;
        display: flex;
        flex-wrap: wrap;
        padding: 0;
        margin-top: 16px;
        background: transparent;
        border: 0;
      }

      .sticky-actions button {
        flex: 1;
        min-width: 145px;
      }

      .sticky-actions .wide { flex-basis: 100%; }
    }

    @media print {
      body {
        padding: 0;
        color: #111;
        background: white;
      }

      header, .settings-card, .sticky-actions, .status {
        display: none !important;
      }

      main {
        display: block;
        max-width: none;
        padding: 0;
      }

      .results-card, .metric, .segment-card, .player-summary {
        color: #111;
        background: white;
        border-color: #aaa;
      }

      .goalie, .offense, .defense, .bench {
        color: #111;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Youth Soccer Substitution Planner</h1>
    <p>U8 and U10 mobile sideline rotation planner.</p>
  </header>

  <main>
    <section class="card settings-card">
      <h2>Game Setup</h2>

      <div class="settings-grid">
        <div>
          <label for="teamLevel">Team</label>
          <select id="teamLevel">
            <option value="u10">U10 — 8v8</option>
            <option value="u8">U8 — 7v7</option>
          </select>
        </div>

        <div>
          <label for="gameLength">Game Length (Minutes)</label>
          <input id="gameLength" type="number" min="12" value="50" />
        </div>
      </div>

      <p id="timingHint" class="hint"></p>

      <h3 style="margin-top: 20px;">Attendance and Goalkeeper Eligibility</h3>
      <div id="rosterGrid" class="roster-grid"></div>

      <div id="statusMessage" class="status"></div>

      <div class="sticky-actions">
        <button id="generateBtn" class="success wide">Generate Rotation</button>
        <button id="allBtn" class="secondary">Mark All Present</button>
        <button id="noneBtn" class="secondary">Clear Attendance</button>
      </div>
    </section>

    <section class="card results-card">
      <h2>Rotation Plan</h2>

      <div id="emptyState" class="empty">
        Mark the players attending, then choose <strong>Generate Rotation</strong>.
      </div>

      <div id="results" style="display: none;">
        <div class="summary-grid">
          <div class="metric">
            <div class="metric-label">Players Present</div>
            <div id="presentCount" class="metric-value">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">On Field</div>
            <div id="fieldCount" class="metric-value">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Minimum Time</div>
            <div id="minimumTime" class="metric-value">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Regular Subs</div>
            <div id="subTime" class="metric-value">0</div>
          </div>
        </div>

        <button
          class="secondary"
          style="width: 100%; margin-bottom: 12px;"
          onclick="window.print()"
        >
          Print Rotation Plan
        </button>

        <div id="schedule"></div>

        <h3 style="margin-top: 22px;">Playing-Time Summary</h3>
        <div id="playerSummary"></div>
      </div>
    </section>
  </main>

  <script>
    const TEAM_SETTINGS = {
      u10: {
        playersOnField: 8,
        offenseSlots: 4,
        defenseSlots: 3,
        interval: 5,
        defaultLength: 50
      },
      u8: {
        playersOnField: 7,
        offenseSlots: 3,
        defenseSlots: 3,
        interval: 4,
        defaultLength: 48
      }
    };

    const teams = {
      u10: [
        { id: 1, name: "Elias", goalieEligible: false, attending: false },
        { id: 2, name: "Finnegan", goalieEligible: true, attending: false },
        { id: 3, name: "Woodfin", goalieEligible: true, attending: false },
        { id: 4, name: "Aadam", goalieEligible: true, attending: false },
        { id: 5, name: "AJ", goalieEligible: false, attending: false },
        { id: 6, name: "Henry", goalieEligible: true, attending: false },
        { id: 7, name: "Wyatt", goalieEligible: true, attending: false },
        { id: 8, name: "Hubert", goalieEligible: false, attending: false },
        { id: 9, name: "Conner", goalieEligible: true, attending: false },
        { id: 10, name: "Trevor", goalieEligible: false, attending: false },
        { id: 11, name: "Jerome", goalieEligible: false, attending: false },
        { id: 12, name: "Hosea", goalieEligible: false, attending: false },
        { id: 13, name: "Mike", goalieEligible: false, attending: false }
      ],
      u8: [
        { id: 1, name: "Cana", goalieEligible: true, attending: false },
        { id: 2, name: "Margot", goalieEligible: true, attending: false },
        { id: 3, name: "Charlotte", goalieEligible: true, attending: false },
        { id: 4, name: "Erin-Rose", goalieEligible: true, attending: false },
        { id: 5, name: "Kora", goalieEligible: true, attending: false },
        { id: 6, name: "Olivia", goalieEligible: true, attending: false },
        { id: 7, name: "Layla", goalieEligible: true, attending: false },
        { id: 8, name: "Amelia", goalieEligible: true, attending: false },
        { id: 9, name: "Sydney", goalieEligible: true, attending: false }
      ]
    };

    const teamLevel = document.getElementById("teamLevel");
    const gameLength = document.getElementById("gameLength");
    const timingHint = document.getElementById("timingHint");
    const rosterGrid = document.getElementById("rosterGrid");
    const statusMessage = document.getElementById("statusMessage");

    const emptyState = document.getElementById("emptyState");
    const results = document.getElementById("results");
    const schedule = document.getElementById("schedule");
    const playerSummary = document.getElementById("playerSummary");

    function getTeamKey() {
      return teamLevel.value;
    }

    function getSettings() {
      return TEAM_SETTINGS[getTeamKey()];
    }

    function getTeam() {
      return teams[getTeamKey()];
    }

    function formatClock(value) {
      const minutes = Math.floor(value);
      const seconds = Math.round((value - minutes) * 60);
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function formatMinutes(value) {
      const rounded = Math.round(value * 10) / 10;
      return `${rounded} min`;
    }

    function showStatus(message, type = "") {
      statusMessage.textContent = message;
      statusMessage.className = type ? `status ${type}` : "status";
    }

    function updateTimingHint() {
      if (getTeamKey() === "u10") {
        timingHint.textContent =
          "U10 uses regular five-minute substitutions. The goalkeeper changes at each quarter. For off-cycle quarter changes, the incoming goalkeeper is reserved on the bench at the previous regular substitution.";
      } else {
        timingHint.textContent =
          "U8 uses four 12-minute quarters with substitutions every four minutes. Goalkeepers change at 12:00, 24:00, and 36:00.";
      }
    }

    function renderRoster() {
      rosterGrid.innerHTML = getTeam().map((player, index) => `
        <div class="player-card">
          <div class="player-name">
            ${player.name}
            <span class="player-number">Player ${player.id}</span>
          </div>

          <label class="toggle-label">
            Present
            <input
              type="checkbox"
              data-index="${index}"
              data-field="attending"
              ${player.attending ? "checked" : ""}
            />
          </label>

          <label class="toggle-label">
            GK
            <input
              type="checkbox"
              data-index="${index}"
              data-field="goalieEligible"
              ${player.goalieEligible ? "checked" : ""}
            />
          </label>
        </div>
      `).join("");

      rosterGrid.querySelectorAll("input").forEach(input => {
        input.addEventListener("change", event => {
          const player = getTeam()[Number(event.target.dataset.index)];
          player[event.target.dataset.field] = event.target.checked;
        });
      });
    }

    function createStats(players) {
      const stats = {};

      players.forEach(player => {
        stats[player.id] = {
          totalMinutes: 0,
          goalieMinutes: 0,
          offenseMinutes: 0,
          defenseMinutes: 0,
          benchStreak: 0,
          playStreak: 0
        };
      });

      return stats;
    }

    function randomTie() {
      return Math.random() - 0.5;
    }

    function chooseGoalie(players, previousGoalieId, stats) {
      return players
        .filter(player => player.goalieEligible && player.id !== previousGoalieId)
        .sort((a, b) => {
          const goalieDifference =
            stats[a.id].goalieMinutes - stats[b.id].goalieMinutes;

          if (goalieDifference !== 0) return goalieDifference;

          const totalDifference =
            stats[a.id].totalMinutes - stats[b.id].totalMinutes;

          if (totalDifference !== 0) return totalDifference;

          return randomTie();
        })[0];
    }

    function chooseReservedGoalie(players, activeGoalie, stats) {
      const eligible = players
        .filter(player =>
          player.goalieEligible &&
          player.id !== activeGoalie.id &&
          stats[player.id].benchStreak < 2
        )
        .sort((a, b) => {
          const totalDifference =
            stats[a.id].totalMinutes - stats[b.id].totalMinutes;

          if (totalDifference !== 0) return totalDifference;

          const goalieDifference =
            stats[a.id].goalieMinutes - stats[b.id].goalieMinutes;

          if (goalieDifference !== 0) return goalieDifference;

          return randomTie();
        });

      return eligible[0] || null;
    }

    function playerRank(player, role, stats, mustPlayIds) {
      const stat = stats[player.id];
      const opposite = role === "offenseMinutes"
        ? "defenseMinutes"
        : "offenseMinutes";

      return {
        mustPlay: mustPlayIds.includes(player.id) ? 0 : 1,
        totalMinutes: stat.totalMinutes,
        roleMinutes: stat[role],
        roleImbalance: stat[role] - stat[opposite],
        shortPlayPenalty: stat.playStreak === 1 ? -1 : 0,
        random: Math.random()
      };
    }

    function chooseRolePlayers(candidates, numberNeeded, role, stats, mustPlayIds) {
      return [...candidates]
        .sort((a, b) => {
          const ar = playerRank(a, role, stats, mustPlayIds);
          const br = playerRank(b, role, stats, mustPlayIds);

          if (ar.mustPlay !== br.mustPlay) return ar.mustPlay - br.mustPlay;
          if (ar.totalMinutes !== br.totalMinutes) {
            return ar.totalMinutes - br.totalMinutes;
          }
          if (ar.roleMinutes !== br.roleMinutes) {
            return ar.roleMinutes - br.roleMinutes;
          }
          if (ar.roleImbalance !== br.roleImbalance) {
            return ar.roleImbalance - br.roleImbalance;
          }
          if (ar.shortPlayPenalty !== br.shortPlayPenalty) {
            return ar.shortPlayPenalty - br.shortPlayPenalty;
          }

          return ar.random - br.random;
        })
        .slice(0, numberNeeded);
    }

    function chooseLineup(players, activeGoalie, reservedGoalie, settings, stats) {
      const excludedIds = [activeGoalie.id];

      if (reservedGoalie) {
        excludedIds.push(reservedGoalie.id);
      }

      const candidates = players.filter(
        player => !excludedIds.includes(player.id)
      );

      const mustPlayIds = players
        .filter(player =>
          player.id !== activeGoalie.id &&
          player.id !== (reservedGoalie ? reservedGoalie.id : null) &&
          stats[player.id].benchStreak >= 2
        )
        .map(player => player.id);

      const offense = chooseRolePlayers(
        candidates,
        settings.offenseSlots,
        "offenseMinutes",
        stats,
        mustPlayIds
      );

      const offenseIds = offense.map(player => player.id);

      const defense = chooseRolePlayers(
        candidates.filter(player => !offenseIds.includes(player.id)),
        settings.defenseSlots,
        "defenseMinutes",
        stats,
        mustPlayIds
      );

      return { offense, defense };
    }

    function addSegment(plan, players, stats, start, end, label, goalie, offense, defense) {
      const duration = end - start;

      if (duration <= 0) return;

      const lineupIds = [
        goalie.id,
        ...offense.map(player => player.id),
        ...defense.map(player => player.id)
      ];

      const bench = players.filter(player => !lineupIds.includes(player.id));

      stats[goalie.id].totalMinutes += duration;
      stats[goalie.id].goalieMinutes += duration;

      offense.forEach(player => {
        stats[player.id].totalMinutes += duration;
        stats[player.id].offenseMinutes += duration;
      });

      defense.forEach(player => {
        stats[player.id].totalMinutes += duration;
        stats[player.id].defenseMinutes += duration;
      });

      plan.push({
        start,
        end,
        label,
        goalie,
        offense,
        defense,
        bench
      });
    }

    function updateRegularRotationStreaks(players, stats, goalie, offense, defense) {
      const activeIds = [
        goalie.id,
        ...offense.map(player => player.id),
        ...defense.map(player => player.id)
      ];

      players.forEach(player => {
        if (activeIds.includes(player.id)) {
          stats[player.id].benchStreak = 0;
          stats[player.id].playStreak += 1;
        } else {
          stats[player.id].benchStreak += 1;
          stats[player.id].playStreak = 0;
        }
      });
    }

    function getU10SpecialChange(blockStart, blockEnd, length) {
      const quarterOne = length / 4;
      const quarterThree = length * 3 / 4;

      if (quarterOne > blockStart && quarterOne < blockEnd) {
        return quarterOne;
      }

      if (quarterThree > blockStart && quarterThree < blockEnd) {
        return quarterThree;
      }

      return null;
    }

    function buildRotation(players, settings, length, teamKey) {
      const plan = [];
      const stats = createStats(players);
      const warnings = [];

      const regularBlocks = [];
      for (let start = 0; start < length; start += settings.interval) {
        regularBlocks.push({
          start,
          end: Math.min(start + settings.interval, length)
        });
      }

      let activeGoalie = chooseGoalie(players, null, stats);

      if (!activeGoalie) {
        return {
          error: "At least two attending players must be marked goalkeeper eligible."
        };
      }

      const half = length / 2;
      const quarter = length / 4;
      let priorGoalieId = null;

      regularBlocks.forEach((block, blockIndex) => {
        const startsNewU8Quarter =
          teamKey === "u8" &&
          blockIndex > 0 &&
          Math.abs(block.start % quarter) < 0.01;

        const startsU10Halftime =
          teamKey === "u10" &&
          Math.abs(block.start - half) < 0.01;

        if (startsNewU8Quarter || startsU10Halftime) {
          priorGoalieId = activeGoalie.id;
          activeGoalie = chooseGoalie(players, priorGoalieId, stats);

          if (!activeGoalie) {
            warnings.push(
              "A goalkeeper rotation could not avoid repeating the prior goalkeeper."
            );
          }
        }

        const specialGoalieChange =
          teamKey === "u10"
            ? getU10SpecialChange(block.start, block.end, length)
            : null;

        let reservedGoalie = null;

        if (specialGoalieChange) {
          reservedGoalie = chooseReservedGoalie(players, activeGoalie, stats);

          if (!reservedGoalie) {
            warnings.push(
              `No goalkeeper-eligible player with a safe bench streak was available for the ${formatClock(specialGoalieChange)} goalkeeper change.`
            );

            reservedGoalie = players.find(player =>
              player.goalieEligible && player.id !== activeGoalie.id
            );
          }
        }

        const lineup = chooseLineup(
          players,
          activeGoalie,
          reservedGoalie,
          settings,
          stats
        );

        const regularLabel = block.start === 0
          ? "Starting lineup"
          : `Regular substitution — ${formatClock(block.start)}`;

        if (!specialGoalieChange) {
          addSegment(
            plan,
            players,
            stats,
            block.start,
            block.end,
            regularLabel,
            activeGoalie,
            lineup.offense,
            lineup.defense
          );
        } else {
          addSegment(
            plan,
            players,
            stats,
            block.start,
            specialGoalieChange,
            `${regularLabel}; next goalkeeper reserved on bench`,
            activeGoalie,
            lineup.offense,
            lineup.defense
          );

          addSegment(
            plan,
            players,
            stats,
            specialGoalieChange,
            block.end,
            `Goalkeeper-only change — ${formatClock(specialGoalieChange)}`,
            reservedGoalie,
            lineup.offense,
            lineup.defense
          );

          priorGoalieId = activeGoalie.id;
          activeGoalie = reservedGoalie;
        }

        updateRegularRotationStreaks(
          players,
          stats,
          activeGoalie,
          lineup.offense,
          lineup.defense
        );
      });

      const threeBenchRotations = players.filter(
        player => stats[player.id].benchStreak >= 3
      );

      if (threeBenchRotations.length) {
        warnings.push(
          `Bench-streak review: ${threeBenchRotations.map(player => player.name).join(", ")} ended with three or more consecutive regular bench rotations.`
        );
      }

      return { plan, stats, warnings };
    }

    function renderResults(players, rotation, settings, totalMinutes) {
      document.getElementById("presentCount").textContent = players.length;
      document.getElementById("fieldCount").textContent = settings.playersOnField;
      document.getElementById("minimumTime").textContent =
        formatMinutes(totalMinutes / 2);
      document.getElementById("subTime").textContent =
        `${settings.interval} min`;

      schedule.innerHTML = rotation.plan.map(segment => `
        <article class="segment-card">
          <div class="segment-heading">
            <span>${formatClock(segment.start)}–${formatClock(segment.end)}</span>
            <span class="checkpoint">${segment.label}</span>
          </div>

          <div class="role-row">
            <span class="role-label">Goalkeeper</span>
            <span class="goalie">${segment.goalie.name}</span>
          </div>

          <div class="role-row">
            <span class="role-label">Offense</span>
            <span class="offense">${segment.offense.map(player => player.name).join(", ")}</span>
          </div>

          <div class="role-row">
            <span class="role-label">Defense</span>
            <span class="defense">${segment.defense.map(player => player.name).join(", ")}</span>
          </div>

          <div class="role-row">
            <span class="role-label">Bench</span>
            <span class="bench">${
              segment.bench.length
                ? segment.bench.map(player => player.name).join(", ")
                : "No bench players"
            }</span>
          </div>
        </article>
      `).join("");

      playerSummary.innerHTML = [...players]
        .sort((a, b) => a.id - b.id)
        .map(player => {
          const stat = rotation.stats[player.id];
          const benchMinutes = totalMinutes - stat.totalMinutes;
          const minimumMet = stat.totalMinutes >= totalMinutes / 2;

          return `
            <article class="player-summary">
              <div>
                <strong>${player.name}</strong>
                <div class="detail">
                  GK ${formatMinutes(stat.goalieMinutes)} ·
                  O ${formatMinutes(stat.offenseMinutes)} ·
                  D ${formatMinutes(stat.defenseMinutes)} ·
                  Bench ${formatMinutes(benchMinutes)}
                </div>
              </div>

              <div class="minutes">
                ${formatMinutes(stat.totalMinutes)}
                <div class="${minimumMet ? "minimum-yes" : "minimum-no"} detail">
                  ${minimumMet ? "Half-game met" : "Below minimum"}
                </div>
              </div>
            </article>
          `;
        }).join("");

      emptyState.style.display = "none";
      results.style.display = "block";
    }

    function generateRotation() {
      const players = getTeam().filter(player => player.attending);
      const settings = getSettings();
      const totalMinutes = Number(gameLength.value);
      const teamKey = getTeamKey();

      if (!Number.isFinite(totalMinutes) || totalMinutes < settings.interval) {
        showStatus(
          `Enter a game length of at least ${settings.interval} minutes.`,
          "warning"
        );
        return;
      }

      if (players.length < settings.playersOnField) {
        showStatus(
          `${players.length} players are marked present, but ${settings.playersOnField} are required on the field.`,
          "warning"
        );
        return;
      }

      if (teamKey === "u8" && totalMinutes !== 48) {
        showStatus(
          "U8 defaults to four 12-minute quarters. A different game length may place goalkeeper changes away from normal four-minute substitution points.",
          "warning"
        );
      }

      if (teamKey === "u10" && totalMinutes !== 50) {
        showStatus(
          "U10 defaults to 50 minutes. A different game length may place quarter goalkeeper changes away from the expected 12:30 and 37:30 checkpoints.",
          "warning"
        );
      }

      const rotation = buildRotation(
        players,
        settings,
        totalMinutes,
        teamKey
      );

      if (rotation.error) {
        showStatus(rotation.error, "warning");
        return;
      }

      const belowMinimum = players.filter(
        player => rotation.stats[player.id].totalMinutes < totalMinutes / 2
      );

      const messages = [];

      if (belowMinimum.length) {
        messages.push(
          `Half-game minimum not met for: ${belowMinimum.map(player => player.name).join(", ")}.`
        );
      }

      if (rotation.warnings.length) {
        messages.push(...rotation.warnings);
      }

      if (messages.length) {
        showStatus(messages.join(" "), "warning");
      } else {
        showStatus(
          `New rotation generated. Regular substitutions are every ${settings.interval} minutes, with goalkeeper rules applied.`,
          "good"
        );
      }

      renderResults(players, rotation, settings, totalMinutes);
    }

    teamLevel.addEventListener("change", () => {
      gameLength.value = getSettings().defaultLength;
      renderRoster();
      updateTimingHint();

      results.style.display = "none";
      emptyState.style.display = "block";
      showStatus("");
    });

    document.getElementById("generateBtn").addEventListener(
      "click",
      generateRotation
    );

    document.getElementById("allBtn").addEventListener("click", () => {
      getTeam().forEach(player => {
        player.attending = true;
      });

      renderRoster();
    });

    document.getElementById("noneBtn").addEventListener("click", () => {
      getTeam().forEach(player => {
        player.attending = false;
      });

      renderRoster();
      results.style.display = "none";
      emptyState.style.display = "block";
      showStatus("");
    });

    renderRoster();
    updateTimingHint();
  </script>
</body>
</html>
